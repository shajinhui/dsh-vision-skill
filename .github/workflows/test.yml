name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript
        run: node --check vision.js
      - name: Run tests
        run: node --test tests/vision.test.js
      - name: Type-check macOS clipboard helper
        if: runner.os == 'macOS'
        run: swiftc -typecheck clipboard.swift
      - name: Parse Windows PowerShell helpers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content clipboard.ps1 -Raw)) | Out-Null
